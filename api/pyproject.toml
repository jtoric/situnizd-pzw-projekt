[project]
name = "pl-reg-api"
version = "0.1.0"
description = "Prijave klubova na powerlifting natjecanja"
requires-python = ">=3.11"

# Zavisnosti su u requirements.txt; ovdje je samo konfiguracija alata.

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# E/W: stil, F: pogreške vidljive iz koda, npr. neiskorišten uvoz ili krivi naziv,
# I: redoslijed uvoza
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# async def testovi i fixtureovi rade bez posebne oznake
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
# SQLAlchemy u asinkronom radu izvodi kod nakon await unutar greenleta. Bez ove postavke
# coverage te retke ne vidi i prijavljuje ih kao neizvedene, iako su ih testovi prošli.
concurrency = ["greenlet", "thread"]
# Početni podatci su razvojni alat, a ne dio aplikacije koju testovi provjeravaju
omit = ["app/seed.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
