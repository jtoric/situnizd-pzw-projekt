# Provjera svakog pusha na main i svakog pull requesta: backend, frontend i cijela aplikacija u
# pregledniku, izgrađena kao u produkciji. CI ništa ne objavljuje; samo kaže je li izmjena ispravna.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Poslovi samo čitaju repozitorij
permissions:
  contents: read

# Novi push na istu granu prekida provjeru prethodnoga, koja više nikome ne treba
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Backend
    # Izdanje sustava zadano je izrijekom; ubuntu-latest se mijenja sam, a s njim i ishod provjere
    runs-on: ubuntu-24.04
    # Zapeli posao inače troši minute do zadanih šest sati
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pl_reg
          POSTGRES_USER: pl_user
          POSTGRES_PASSWORD: pl_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pl_user -d pl_reg"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      # Testovi rade nad bazom pl_reg_test, koju stvaraju sami (api/tests/conftest.py)
      DATABASE_URL: postgresql+asyncpg://pl_user:pl_pass@localhost:5432/pl_reg
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Stil i pogreške vidljive iz koda
        run: |
          ruff check .
          ruff format --check .
      - name: Testovi i pokrivenost
        run: pytest --cov

  web:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm ci instalira točno ono iz package-lock.json i pada kad se on ne slaže s package.json
      - run: npm ci
      - name: Provjera tipova i izgradnja
        run: npm run build
      - name: Jedinični testovi
        run: npm test

  e2e:
    name: Kroz preglednik
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Jednokratne tajne
        # Okolina postoji samo za vrijeme posla, pa joj tajne nastaju ovdje i nigdje se ne čuvaju
        run: |
          printf 'DB_PASSWORD=%s\nJWT_SECRET=%s\nWEB_PORT=8080\n' \
            "$(openssl rand -hex 24)" "$(openssl rand -hex 32)" > .env.prod
      - name: Aplikacija u Dockeru, kao u produkciji
        # --wait: naredba završava tek kad su servisi zdravi (healthcheck)
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build --wait
      - name: Početni podatci za testove
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T api python -m app.seed
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Testovi kroz preglednik
        working-directory: web
        run: npm run test:e2e
        env:
          E2E_URL: http://127.0.0.1:8080
      - name: Zapisi kontejnera
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod logs
      - name: Izvještaj Playwrighta
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14
