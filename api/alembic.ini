[alembic]
script_location = %(here)s/alembic

# Nazivi datoteka: 001_init_clubs_and_users.py
# Oznaka se zadaje pri stvaranju: alembic revision --rev-id 002 ...
file_template = %%(rev)s_%%(slug)s

# Mapa api/ ulazi u sys.path, pa env.py može uvesti paket app
prepend_sys_path = .
path_separator = os

# Adresu baze postavlja env.py iz app.core.config, a ona dolazi iz DATABASE_URL
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
