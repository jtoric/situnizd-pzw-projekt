# nginx u slici frontenda (web/Dockerfile): poslužuje izgrađenu aplikaciju i prosljeđuje /api
# backendu. Preglednik stranicu i API dobiva s istog izvora, pa CORS nije potreban ni u
# produkciji; istu ulogu u razvoju ima proxy u vite.config.ts.

# Prijava: najviše 30 pokušaja u minuti po adresi, uz nalet od 30. Pogađanje lozinke tako traje
# predugo da bi imalo smisla, a testovi kroz preglednik, koji se prijavljuju često, prolaze.
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tijelo zahtjeva ove aplikacije je JSON od nekoliko kB; veće se odbija prije backenda
    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Sigurnosna zaglavlja za svaki odgovor; "always" i za odgovore 4xx i 5xx. Lokacije niže ne
    # smiju imati vlastiti add_header: nginx bi tada u njima zanemario sva ova. Predmemorija se
    # zato zadaje direktivom expires, koja nije add_header.
    #
    # CSP: preglednik izvodi skripte i stilove samo s ove adrese i šalje zahtjeve samo njoj.
    # Skripta koju bi netko ubacio u stranicu ne bi se izvela, a ni token ne bi mogla poslati
    # drugamo. frame-ancestors: stranica se ne smije prikazati unutar tuđe stranice.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Preglednik ne pogađa vrstu datoteke mimo zaglavlja Content-Type
    add_header X-Content-Type-Options "nosniff" always;
    # Drugom webu se šalje samo izvor, bez putanje (koja nosi oznake natjecanja i natjecatelja)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Datoteke iz /assets/ u imenu nose sažetak sadržaja (index-DvWUQxs0.js): nova inačica je
    # nova datoteka, pa se stara smije držati u predmemoriji godinu dana
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /api/auth/login {
        limit_req zone=login burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/auth/login;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /api/competitions/ -> http://api:8000/competitions/: kosa crta na kraju proxy_pass
    # zamjenjuje /api/ s /. "api" je ime servisa u docker-compose.prod.yml.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Svaka druga adresa je ruta aplikacije (/natjecanja/1) ili datoteka iz public/. Ruta ne
    # postoji kao datoteka, pa nginx vraća index.html, a prikaz bira router u pregledniku. Bez
    # ovoga bi osvježavanje bilo koje stranice osim početne dalo 404.
    location / {
        # index.html se provjerava pri svakom učitavanju, da nakon objave preglednik dobije
        # novu inačicu, a s njom i nova imena datoteka iz /assets/
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
